<!doctype html>
<html><head><meta charset="utf-8"><title>Promo</title>
<link rel="stylesheet" href="_runtime/runtime.css">
<style>
/* ════════════════════════════════════════════════════════════════════
   骨架：只提供「素材層＋時間工具」。所有場景、版面、文字由你設計。
   設計前先讀 references/04-visual-language.md：視覺從產品長出來。
   ════════════════════════════════════════════════════════════════════ */

/* ① 設計變數：換成產品自己的色票與字型（看產品的 CSS 變數 / DESIGN.md / 截圖取色） */
@font-face{font-family:"Brand";src:url("assets/fonts/manrope.woff2") format("woff2");font-weight:200 800;font-display:block}
:root{
  --bg1:#1a1f24; --bg2:#121619; --bg3:#0b0e10;   /* 底色（產品背景再壓暗） */
  --cream:#eef1f2; --muted:#93a0a6;               /* 主文字 / 次要文字 */
  --gold:#7fd3b0;                                 /* 重點色：runtime 用這個變數，設成產品主色 */
  --line:rgba(255,255,255,.18);                   /* 細線、框線 */
  --glow-rgb:127,211,176;                         /* 背景光點顏色 */
  /* 加上產品的語意色，例如 --ok / --warn / --energy …，意義要跟產品一致 */
  --sans:"Brand","Noto Sans CJK TC","Noto Sans TC","PingFang TC",sans-serif;
}
body{font-family:var(--sans)}
.h1,.h2,.serif,#chrome .brandmark{font-family:var(--sans)!important}

/* ② 素材層（不要改）：每個 .clip 是一段 capture.py 擷取的畫面 */
.clip{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;opacity:0}
.clip img{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;transform-origin:50% 50%}
.shade{position:absolute;inset:0;pointer-events:none}   /* 放在 .clip 裡當遮罩，讓文字有底 */

/* ③ 你的場景樣式寫在這裡。
   提醒：.glass 自帶 position:relative，絕對定位的卡片要加 position:absolute!important；
        沒有 .abs class 的容器要自己寫 position:absolute；
        上方 140px 是品牌列、下方 160px 是字幕。 */

</style></head>
<body>
<div id="stage">
  <!-- ④ 素材層：照「出現順序」排（DOM 越後面越上層）。
       data-clip = assets/clips/ 下的資料夾名；data-n = 該資料夾的圖片張數。
  <div id="c_overview" class="clip"><img data-clip="overview" data-n="255" src="assets/clips/overview/0000.jpg"></div>
  -->

  <!-- ⑤ 你的場景元素（文字、卡片、圖解、SVG…）放在這裡 -->

</div>
<script src="_runtime/gsap.min.js"></script>
<script src="_tl.js"></script>
<script src="_runtime/core.js"></script>
<script>
const CLIPS = [];
window.EPISODE = {
  strings: { zh: {}, en: {} },
  build(c) {
    const { m, S, L, LE, LM } = c;          // 時間函式：S(i).start、L(i,j)、LE(i,j)、LM(i,j,k)。不要寫死秒數。
    const E = "expo.out", IO = "expo.inOut";

    /* ── 工具（可直接用，也可以自己寫新的） ── */
    const fadeIn = (sel, t, d = .7) => m.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, t);
    const fadeOut = (sel, t, d = .5) => m.to(sel, { opacity: 0, duration: d, ease: "power2.in" }, t);
    const pop = (sel, t) => m.fromTo(sel, { opacity: 0, y: 24, scale: .94 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: "back.out(1.6)" }, t);
    const words = (sel, t, gap = .4) => m.fromTo(sel + " .w", { opacity: 0, y: 70, filter: "blur(16px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1, ease: E, stagger: gap }, t);
    // 素材：t0 秒顯示第 skip 格，之後每秒 30 格，播完停在最後一格；t1+0.6 秒自動隱藏。
    // 對時公式：動作在第 F 格、想落在時間 T → clip(sel, T - F/30, t1)
    const clip = (sel, t0, t1, skip = 0) => { const el = c.$(sel); const img = el.tagName === "IMG" ? el : el.querySelector("img"); CLIPS.push({ img, t0, t1, skip, n: +img.dataset.n }); if (el.classList.contains("clip")) m.set(el, { opacity: 0 }, t1 + .6); };
    const cutIn = (sel, t, d = .8) => m.fromTo(sel, { opacity: 0, clipPath: "inset(0 0 0 100%)" }, { opacity: 1, clipPath: "inset(0 0 0 0%)", duration: d, ease: IO }, t);
    const zoomTo = (sel, x, y, scale, t, d = 1.4) => { m.set(sel + " img", { transformOrigin: `${x}px ${y}px` }, t - .01); m.fromTo(sel + " img", { scale: 1 }, { scale, duration: d, ease: IO }, t); };
    const drift = (sel, t, d, s0 = 1.05, s1 = 1.18) => m.fromTo(sel + " img", { scale: s0 }, { scale: s1, duration: d, ease: "none" }, t);
    // runtime 另外提供：c.rise / c.out / c.count / c.tilt / c.sheen / c.wipe / c.type（見 motion-video 的 animation-cookbook）

    /* ── ⑥ 你的場景：依 beat sheet 一場一場寫。每場先想「這句話觀眾要看到什麼」。 ── */

  },
  tick(t, c) {
    // 素材換格（不要刪）
    for (const k of CLIPS) {
      if (t < k.t0 - .05 || t > k.t1 + .05) continue;
      const f = Math.max(0, Math.min(k.n - 1, Math.floor((t - k.t0) * 30) + k.skip));
      const src = `assets/clips/${k.img.dataset.clip}/${String(f).padStart(4, "0")}.jpg`;
      if (k.img.getAttribute("src") !== src) k.img.setAttribute("src", src);
    }
    // 需要每格重算的程序動畫（粒子、沿路徑流動的光點…）寫在這裡，只能用 t 計算
  }
};
</script>
<script src="_runtime/runtime.js"></script>
<script>
/* 渲染時等新的一格圖片解碼完才截圖，否則會截到上一格。不要刪。 */
(() => {
  const base = window.__seek;
  window.__seek = (t) => {
    base(t);
    const imgs = [...document.querySelectorAll("img[data-clip]")].filter(i => !i.complete || !i.naturalWidth);
    if (!imgs.length) return true;
    return Promise.all(imgs.map(i => i.decode().catch(() => null))).then(() => true);
  };
})();
</script>
</body></html>
